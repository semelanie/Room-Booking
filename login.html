<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management Login — NIHSS Room Booking</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9 4.6-.8 8-4.6 8-9V6l-8-3Z"/></svg>
    </div>

    <h1>Management Login</h1>
    <p>NIHSS Room Booking System</p>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Username or Email</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/></svg>
          <input type="email" id="loginEmail" placeholder="Enter your username" required>
        </div>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
          <button type="button" class="input-eye" id="togglePassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="auth-row">
        <label class="remember-check"><input type="checkbox" id="rememberMe" checked><span>Remember me</span></label>
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Login
      </button>
      <div class="form-msg" id="loginMsg"></div>
    </form>

    <a href="index.html" class="auth-back">&larr; Back to Website</a>

    <div class="demo-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      Demo: admin@nihss.edu / admin123
    </div>
  </div>

  <p class="auth-footer-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    Secure administrative access only. All activities are logged.
  </p>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
